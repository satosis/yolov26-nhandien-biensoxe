      init() {
        let saved = '';
        try {
          saved = localStorage.getItem('sl_lang') || '';
        } catch(e) {}
        if (!saved) {
          const m = document.cookie.match(/lang_pref=([^;]+)/);
          if (m && m[1]) saved = m[1];
        }
        if (!saved) {
          const browserLang = (navigator.language || '').toLowerCase();
          saved = browserLang.startsWith('zh') ? 'zh' : 'vi';
        }
        this.lang = (saved === 'zh') ? 'zh' : 'vi';
      },
      setLang(l) {
        this.lang = (l === 'zh') ? 'zh' : 'vi';
        try {
          localStorage.setItem('sl_lang', this.lang);
        } catch(e) {}
        document.cookie = 'lang_pref=' + this.lang + '; path=/; max-age=31536000; SameSite=Lax';
        window.dispatchEvent(new CustomEvent('sl-lang-changed', { detail: { lang: this.lang } }));
      },
      t(key) {
        if (!this.translations[this.lang]) return key;
        return this.translations[this.lang][key] || (this.translations['vi'][key] || key);
      }
    });
