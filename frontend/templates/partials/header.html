
<header id="page-topbar">
  <div class="navbar-header d-flex justify-content-between align-items-center">

    <div class="d-flex align-items-center h-100">

      <div class="navbar-brand-box d-flex align-items-center justify-content-center"
           style="width:220px;height:100%;background:#ffffff;border-right:1px solid #e2e8f0;">
        <a href="/admin/parking_dashboard" class="text-decoration-none d-flex align-items-center gap-2">
          <i class="bx bxs-car-garage text-primary" style="font-size:22px;"></i>
          <span class="fw-bold" style="color:#1e293b;font-size:14px;">Parking Camera</span>
        </a>
      </div>


      <button type="button" class="btn btn-sm px-3 font-size-16 header-item waves-effect border-0 text-dark"
              id="vertical-menu-btn" style="background:transparent;">
        <i class="fa fa-fw fa-bars"></i>
      </button>
    </div>

    <div class="d-flex align-items-center">

      <div class="dropdown d-inline-block">
        <button type="button" class="btn header-item waves-effect d-flex align-items-center"
                style="gap:8px;"
                id="page-header-user-dropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <span class="rounded-circle d-inline-flex align-items-center justify-content-center text-white"
                style="width:26px;height:26px;background:#6366f1;font-size:12px;font-weight:600;">
            {{ (user.username[0] | upper) if user and user.username else 'U' }}
          </span>
          <span class="d-none d-sm-inline-block" style="font-weight:500;">{{ user.username if user else '' }}</span>
          <i class="mdi mdi-chevron-down d-none d-sm-inline-block text-muted" style="font-size:12px;"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-right shadow-sm border-0 py-1" style="min-width:140px;border-radius:8px;">
          <form method="POST" action="/logout" id="admin-logout-form" class="m-0">
            <a class="dropdown-item text-danger d-flex align-items-center py-2" href="#"
               onclick="event.preventDefault(); document.getElementById('admin-logout-form').submit();"
               style="gap:8px;font-size:13px;font-weight:500;">
              <i class="bx bx-log-out font-size-16"></i> Đăng xuất
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
