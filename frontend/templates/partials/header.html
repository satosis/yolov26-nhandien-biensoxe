<!-- Header: appTitle left + userInfo right -->
<span class="text-[15px] font-bold text-white">🅿 Parking Camera</span>
<span class="flex items-center gap-2 text-[13px] text-txt-sec">
  <span class="text-accent font-semibold">{{ user.username }}</span>
  <span class="bg-accent/15 text-accent px-2.5 py-0.5 rounded-full text-[11px] font-semibold border border-accent/20">{{ user.role }}</span>
  
  <form method="POST" action="/logout" class="ml-4 pl-4 border-l border-divider h-5 flex items-center">
     <button type="submit" class="text-txt-sec hover:text-status-red transition-colors text-[12px] font-medium flex items-center gap-1.5" title="Đăng xuất">
       <span>🚪</span> Thoát
     </button>
  </form>
</span>
