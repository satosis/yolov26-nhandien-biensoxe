<form method="get" action="{{ filter_action }}" class="d-flex align-items-end flex-wrap mb-3" style="gap:8px;"
      onsubmit="this.elements['month'].value=this.elements['module_year'].value+'-'+this.elements['module_month_part'].value">
  <input type="hidden" name="month" value="{{ month }}">
  <div style="width:auto;max-width:100%;">
    <label class="d-block mb-1 text-muted" style="font-size:11px;letter-spacing:0.5px;">Tháng</label>
    <div class="d-flex align-items-center" style="gap:4px;">
      <select name="module_month_part" class="form-control form-control-sm"
              style="height:28px !important;min-height:28px;max-height:28px;font-size:12px;padding:2px 8px;line-height:22px;width:auto;min-width:95px;"
              onchange="this.form.requestSubmit()">
        {% for m in range(1, 13) %}
        <option value="{{ '%02d'|format(m) }}" {% if m == month[5:7]|int %}selected{% endif %}>Tháng {{ m }}</option>
        {% endfor %}
      </select>
      <input type="number" name="module_year" value="{{ month[:4] }}" min="1000" max="9999" required
             class="form-control form-control-sm"
             style="height:28px !important;min-height:28px;max-height:28px;font-size:12px;padding:2px 8px;line-height:22px;width:70px;"
             onchange="this.form.requestSubmit()">
    </div>
  </div>
  <div style="width:135px;max-width:100%;">
    <label for="module-vehicle" class="d-block mb-1 text-muted" style="font-size:11px;letter-spacing:0.5px;">Xe</label>
    <select id="module-vehicle" name="vehicle_id" required
            class="form-control form-control-sm"
            style="height:28px !important;min-height:28px;max-height:28px;font-size:12px;padding:2px 8px;line-height:22px;">
      {% for v in vehicle_options %}
      <option value="{{ v.id }}" {% if v.id == vehicle_id %}selected{% endif %}>{{ v.plate_number }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary btn-sm font-weight-bold"
          style="height:28px;min-height:28px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;">
    Xem
  </button>
</form>
