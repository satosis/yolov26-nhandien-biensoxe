<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="csrf-token" content="">
  <title>{% block title %}Quản trị | Parking Camera{% endblock %}</title>
  <link rel="shortcut icon" href="/static/favicon.png" type="image/x-icon">


  <link href="/static/admin-assets/css/bootstrap.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link href="/static/admin-assets/css/icons.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link href="/static/admin-assets/css/theme.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
  <link href="/static/vendor/fonts-inter/index.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/toastr/toastr.min.css" />
  <link rel="stylesheet" href="/static/admin/css/tom-select.css?v=opatix">
  <link href="/static/admin-assets/css/admin-custom.css?v=20261022-bulk-actions-1" rel="stylesheet" type="text/css" />

  <script src="/static/admin/js/htmx.min.js?v=2.1"></script>
  <script src="/static/admin/js/api-client.js?v=1.1"></script>
  <script src="/static/admin/js/alpine.min.js?v=2.1" defer></script>
  <script src="/static/admin/js/tom-select.complete.min.js?v=2.4.1"></script>
  <style>
    [x-cloak]{display:none!important}

    [style*="display: none"], [style*="display:none"]{display:none!important}

    .x-modal-overlay{display:flex}

    .hidden{display:none!important}
    #toast-container { z-index: 999999 !important; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}




  <div x-data="{
    open: false, imgSrc: '',
    showImage(e){ this.imgSrc = e.detail.src; this.open = true; }
  }"
  @show-image.window="showImage($event)"
  x-show="open" x-cloak
  class="position-fixed x-modal-overlay align-items-center justify-content-center p-3"
  style="z-index:10001;top:0;left:0;width:100%;height:100%;">
    <div x-show="open" x-transition.opacity class="position-absolute"
         style="top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);" @click="open=false"></div>
    <div x-show="open" x-transition class="position-relative" style="max-width:90vw;max-height:90vh;">
      <button @click="open=false" class="btn btn-light btn-sm position-absolute"
              style="top:-40px;right:0;"><i class="bx bx-x"></i></button>
      <img :src="imgSrc" class="rounded shadow-lg" style="max-width:90vw;max-height:85vh;object-fit:contain;background:#fff;">
    </div>
  </div>




  <div x-data="{
    open:false, title:'', message:'', confirmText:'Xác nhận', cancelText:'Hủy',
    confirmUrl:'', confirmTarget:'', confirmMethod:'POST', confirmSwap:'outerHTML', redirectUrl:'',
    reload:false, isAlert:false,
    showConfirm(e){
      const d=e.detail||{};
      this.title=d.title||'Xác nhận';
      this.message=d.message||'Bạn có chắc chắn muốn thực hiện hành động này?';
      this.confirmText=d.confirmText||'Xác nhận';
      this.cancelText=d.cancelText||'Hủy';
      this.confirmUrl=d.confirmUrl||''; this.confirmTarget=d.confirmTarget||'';
      this.confirmMethod=d.confirmMethod||'POST'; this.confirmSwap=d.confirmSwap||'outerHTML';
      this.redirectUrl=d.redirectUrl||'';
      this.reload=d.reload||false; this.isAlert=d.isAlert||false; this.open=true;
    },
    confirm(){
      if(this.confirmUrl){
        if(this.redirectUrl){
          apiRequest(this.confirmUrl,{method:this.confirmMethod,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
            .then(result=>{
              if(result.ok){ window.location.assign(this.redirectUrl); return; }
              window.dispatchEvent(new CustomEvent('showToast', {
                detail:{msg:result.message || 'Không thể thực hiện thao tác.',type:'error'}
              }));
            });
        } else if(this.reload){
          apiRequest(this.confirmUrl,{method:this.confirmMethod,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
            .then(result=>{
              if(result.ok){ window.location.reload(); return; }
              window.dispatchEvent(new CustomEvent('showToast', {
                detail:{msg:result.message || 'Không thể thực hiện thao tác.',type:'error'}
              }));
            });
        } else if(this.confirmTarget && typeof htmx!=='undefined'){
          const url=this.confirmUrl+(this.confirmUrl.includes('?')?'&':'?')+'hx=1';
          htmx.ajax(this.confirmMethod,url,{target:this.confirmTarget,swap:this.confirmSwap,headers:{'X-HTMX-Action':'true'}});
        } else {
          apiRequest(this.confirmUrl,{method:this.confirmMethod,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
            .then(d=>{
              const ok = d.ok;
              const msg = d.message || (ok ? 'Thành công' : 'Thất bại');
              window.dispatchEvent(new CustomEvent('showToast', {detail:{msg,type:ok?'success':'error'}}));
            });
        }
      }
      setTimeout(()=>{this.open=false;},10);
    }
  }"
  @show-confirm.window="showConfirm($event)"
  x-show="open" x-cloak
  class="position-fixed x-modal-overlay align-items-center justify-content-center p-3"
  style="z-index:10000;top:0;left:0;width:100%;height:100%;">
    <div x-show="open" x-transition.opacity class="position-absolute"
         style="top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.45);" @click="open=false"></div>
    <div x-show="open" x-transition class="position-relative bg-white rounded shadow-lg p-3"
         style="width:360px;max-width:92vw;">
      <div class="d-flex align-items-center mb-2">
        <i class="bx bx-error-circle text-warning font-size-20 mr-2"></i>
        <h5 class="mb-0 font-size-15 font-weight-bold" x-text="title"></h5>
      </div>
      <p class="text-muted font-size-13 mb-3" x-text="message"></p>
      <div class="d-flex" style="gap:8px;">
        <button @click="confirm()"
                class="btn btn-sm flex-fill text-white"
                :class="isAlert ? 'btn-primary' : 'btn-danger'"
                x-text="confirmText"></button>
        <template x-if="!isAlert">
          <button @click="open=false" class="btn btn-sm btn-light flex-fill" x-text="cancelText"></button>
        </template>
      </div>
    </div>
  </div>


  <script src="/static/admin-assets/js/jquery.min.js"></script>
  <script src="/static/admin-assets/js/bootstrap.bundle.min.js"></script>
  <script src="/static/admin-assets/js/waves.js"></script>
  <script src="/static/admin-assets/js/simplebar.min.js"></script>
  <script src="/static/admin-assets/js/theme.js?v=20261019-multimenu"></script>
  <script src="/static/vendor/toastr/toastr.min.js"></script>
  <script>
    if (window.toastr) {
      toastr.options = {
        closeButton: true,
        progressBar: true,
        positionClass: "toast-top-right",
        escapeHtml: true,
        timeOut: "4000",
        extendedTimeOut: "1000",
        showMethod: "fadeIn",
        hideMethod: "fadeOut"
      };
    }

    window.showNotify = function(msg, type) {
      type = (type || 'success').toLowerCase();
      if (!msg) return;
      if (window.toastr) {
        if (type === 'error' && toastr.error) toastr.error(msg);
        else if (type === 'warning' && toastr.warning) toastr.warning(msg);
        else if (type === 'info' && toastr.info) toastr.info(msg);
        else if (toastr.success) toastr.success(msg);
        else toastr(msg);
      } else {
        window.dispatchEvent(new CustomEvent('showToast', {
          detail: { msg: msg, type: type }
        }));
      }
    };
    window.notify = window.showNotify;

    window.addEventListener("showToast", (e) => {
      const d = e.detail || {};
      const msg = d.msg || d.value || "";
      const type = (d.type || "success");
      if (window.toastr && toastr[type]) { toastr[type](msg); }
      else { console.error('Không thể hiển thị toastr:', msg); }
    });
    document.body.addEventListener("htmx:responseError", () => {
      window.showNotify('Không thể thực hiện thao tác. Vui lòng thử lại.', 'error');
    });
    document.body.addEventListener("htmx:sendError", () => {
      window.showNotify('Không thể kết nối tới máy chủ.', 'error');
    });

    // Tự động kiểm tra query params thông báo và hiển thị toastr
    (function() {
      try {
        const url = new URL(window.location.href);
        const err = url.searchParams.get('error') || url.searchParams.get('error_msg');
        const msg = url.searchParams.get('message') || url.searchParams.get('msg') || url.searchParams.get('success');
        const warn = url.searchParams.get('warning');
        const info = url.searchParams.get('info') || url.searchParams.get('notice');
        let shouldClean = false;
        if (err) {
          window.showNotify(err, 'error');
          url.searchParams.delete('error');
          url.searchParams.delete('error_msg');
          shouldClean = true;
        } else if (warn) {
          window.showNotify(warn, 'warning');
          url.searchParams.delete('warning');
          shouldClean = true;
        } else if (msg) {
          window.showNotify(msg, 'success');
          url.searchParams.delete('message');
          url.searchParams.delete('msg');
          url.searchParams.delete('success');
          shouldClean = true;
        } else if (info) {
          window.showNotify(info, 'info');
          url.searchParams.delete('info');
          url.searchParams.delete('notice');
          shouldClean = true;
        }
        if (shouldClean) {
          window.history.replaceState(null, '', url.pathname + (url.search ? url.search : '') + url.hash);
        }
      } catch (_) {}
    })();

    // Chuyển tiếp window.alert sang Toastr
    if (!window._nativeAlert) {
      window._nativeAlert = window.alert;
      window.alert = function(msg) {
        if (window.toastr) {
          const text = String(msg || '');
          if (/lỗi|error|thất bại|không thể|cảnh báo|chưa|vui lòng/i.test(text)) {
            toastr.error(text);
          } else {
            toastr.info(text);
          }
        } else if (window._nativeAlert) {
          window._nativeAlert(msg);
        }
      };
    }
  </script>
  {% block scripts %}{% endblock %}
  <script src="/static/admin-assets/js/admin-searchable-selects.js?v=20261021-searchable-selects-2"></script>
  <script src="/static/admin-assets/js/admin-bulk-actions.js?v=20261022-bulk-actions-1"></script>
</body>
</html>
