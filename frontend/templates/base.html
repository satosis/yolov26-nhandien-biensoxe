<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="csrf-token" content="">
  <title>{% block title %}Quản trị | Parking Camera{% endblock %}</title>
  <link rel="shortcut icon" href="/static/favicon.png" type="image/x-icon">

  <!-- App css (Opatix admin theme) -->
  <link href="/static/admin-assets/css/bootstrap.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link href="/static/admin-assets/css/icons.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link href="/static/admin-assets/css/theme.min.css?v=opatix" rel="stylesheet" type="text/css" />
  <link href="/static/admin-assets/css/admin-custom.css?v=opatix" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
  <link href="/static/vendor/fonts-inter/index.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/toastr/toastr.min.css" />
  <link rel="stylesheet" href="/static/admin/css/tom-select.css?v=opatix">

  <!-- JS libs used by pages (kept for HTMX/Alpine driven views) -->
  <script src="/static/admin/js/htmx.min.js?v=2.1"></script>
  <script src="/static/admin/js/alpine.min.js?v=2.1" defer></script>
  <script src="/static/admin/js/tom-select.complete.min.js?v=2.4.1"></script>
  <style>[x-cloak]{display:none!important}</style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <!-- ============================================================= -->
  <!-- Global Image Preview Modal (Alpine.js) — light theme           -->
  <!-- ============================================================= -->
  <div x-data="{
    open: false, imgSrc: '',
    showImage(e){ this.imgSrc = e.detail.src; this.open = true; }
  }"
  @show-image.window="showImage($event)"
  x-show="open" x-cloak
  class="position-fixed d-flex align-items-center justify-content-center p-3"
  style="z-index:10001;top:0;left:0;width:100%;height:100%;">
    <div x-show="open" x-transition.opacity class="position-absolute"
         style="top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);" @click="open=false"></div>
    <div x-show="open" x-transition class="position-relative" style="max-width:90vw;max-height:90vh;">
      <button @click="open=false" class="btn btn-light btn-sm position-absolute"
              style="top:-40px;right:0;"><i class="bx bx-x"></i></button>
      <img :src="imgSrc" class="rounded shadow-lg" style="max-width:90vw;max-height:85vh;object-fit:contain;">
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- Global Confirmation Modal (Alpine.js) — light theme            -->
  <!-- ============================================================= -->
  <div x-data="{
    open:false, title:'', message:'', confirmText:'Xác nhận', cancelText:'Hủy',
    confirmUrl:'', confirmTarget:'', confirmMethod:'POST', confirmSwap:'outerHTML',
    reload:false, isAlert:false,
    showConfirm(e){
      const d=e.detail||{};
      this.title=d.title||'Xác nhận';
      this.message=d.message||'Bạn có chắc chắn muốn thực hiện hành động này?';
      this.confirmText=d.confirmText||'Xác nhận';
      this.cancelText=d.cancelText||'Hủy';
      this.confirmUrl=d.confirmUrl||''; this.confirmTarget=d.confirmTarget||'';
      this.confirmMethod=d.confirmMethod||'POST'; this.confirmSwap=d.confirmSwap||'outerHTML';
      this.reload=d.reload||false; this.isAlert=d.isAlert||false; this.open=true;
    },
    confirm(){
      if(this.confirmUrl){
        if(this.reload){
          fetch(this.confirmUrl,{method:this.confirmMethod,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(()=>window.location.reload());
        } else if(typeof htmx!=='undefined'){
          const url=this.confirmUrl+(this.confirmUrl.includes('?')?'&':'?')+'hx=1';
          htmx.ajax(this.confirmMethod,url,{target:this.confirmTarget,swap:this.confirmSwap,headers:{'X-HTMX-Action':'true'}});
        }
      }
      setTimeout(()=>{this.open=false;},10);
    }
  }"
  @show-confirm.window="showConfirm($event)"
  x-show="open" x-cloak
  class="position-fixed d-flex align-items-center justify-content-center p-3"
  style="z-index:10000;top:0;left:0;width:100%;height:100%;">
    <div x-show="open" x-transition.opacity class="position-absolute"
         style="top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.45);" @click="open=false"></div>
    <div x-show="open" x-transition class="position-relative bg-white rounded shadow-lg p-3"
         style="width:360px;max-width:92vw;">
      <div class="d-flex align-items-center mb-2">
        <i class="bx bx-error-circle text-warning font-size-20 mr-2"></i>
        <h5 class="mb-0 font-size-15 font-weight-bold" x-text="title"></h5>
      </div>
      <p class="text-muted font-size-13 mb-3" x-text="message"></p>
      <div class="d-flex" style="gap:8px;">
        <button @click="confirm()"
                class="btn btn-sm flex-fill text-white"
                :class="isAlert ? 'btn-primary' : 'btn-danger'"
                x-text="confirmText"></button>
        <template x-if="!isAlert">
          <button @click="open=false" class="btn btn-sm btn-light flex-fill" x-text="cancelText"></button>
        </template>
      </div>
    </div>
  </div>

  <!-- Opatix theme scripts -->
  <script src="/static/admin-assets/js/jquery.min.js"></script>
  <script src="/static/admin-assets/js/bootstrap.bundle.min.js"></script>
  <script src="/static/admin-assets/js/metismenu.min.js"></script>
  <script src="/static/admin-assets/js/waves.js"></script>
  <script src="/static/admin-assets/js/simplebar.min.js"></script>
  <script src="/static/admin-assets/js/theme.js"></script>
  <script src="/static/vendor/toastr/toastr.min.js"></script>
  <script>
    if (window.toastr) {
      toastr.options = {
        closeButton:true, progressBar:true, positionClass:"toast-top-right",
        timeOut:"4000", extendedTimeOut:"1000",
        showMethod:"fadeIn", hideMethod:"fadeOut"
      };
    }
    // Bridge legacy `showToast` events from HTMX responses to toastr
    document.body.addEventListener("showToast", (e) => {
      const d = e.detail || {};
      const msg = d.msg || d.value || "";
      const type = (d.type || "success");
      if (window.toastr && toastr[type]) { toastr[type](msg); }
      else { alert(msg); }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
