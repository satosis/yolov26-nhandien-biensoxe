<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if view == 'register' %}Đăng ký tài khoản{% elif view == 'forgot' %}Khôi phục mật khẩu{% else %}Đăng nhập{% endif %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/static/favicon.ico?v=clean">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --btn-bg: #4f46e5;
      --btn-hover: #4338ca;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #047857;
    }

    body {
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.06) 0px, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 410px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 34px 30px;
      box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 5px;
    }


    .alert-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .alert-box svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .link-muted {
      font-size: 12.5px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
      cursor: pointer;
    }

    .link-muted:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    .input-field {
      width: 100%;
      height: 44px;
      padding: 0 42px 0 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field.no-icon {
      padding-left: 14px;
    }

    .input-field:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease;
    }

    .toggle-pwd:hover {
      color: var(--text-secondary);
    }

    .toggle-pwd svg {
      width: 18px;
      height: 18px;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      background: var(--btn-bg);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-submit:hover {
      background: var(--btn-hover);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.72;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-submit-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---- Social Login Styles ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--input-border);
    }

    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-social {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: #ffffff;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-social:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .btn-social:active {
      transform: translateY(0);
    }

    .btn-google:hover {
      border-color: rgba(66, 133, 244, 0.5);
      background: rgba(66, 133, 244, 0.1);
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.15);
    }

    .btn-facebook:hover {
      border-color: rgba(24, 119, 242, 0.5);
      background: rgba(24, 119, 242, 0.12);
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.15);
    }

    .social-icon {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .card-footer {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      font-size: 13.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .link-accent {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease;
      cursor: pointer;
    }

    .link-accent:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">

      {% if error %}
      <div class="alert-box alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if success %}
      <div class="alert-box alert-success" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>{{ success }}</span>
      </div>
      {% endif %}

      <!-- ==================== VIEW 1: ĐĂNG NHẬP ==================== -->
      <div id="panel-login" class="view-panel {% if view != 'register' and view != 'forgot' %}active{% endif %}">
        <div class="header">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h1 class="title">Đăng nhập</h1>
        </div>

        <form method="post" action="/login" autocomplete="on">
          <div class="form-group">
            <label class="label" for="login-username">Tài khoản</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="login-username" 
                name="username" 
                class="input-field" 
                placeholder="Tên đăng nhập" 
                required 
                autocomplete="username" 
                value="{{ last_username|default('admin', true) }}"
                {% if not last_username and view != 'register' and view != 'forgot' %}autofocus{% endif %}
              >
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="label" for="login-password">Mật khẩu</label>
              <a href="/forgot-password" class="link-muted switch-view" data-target="panel-forgot">Quên mật khẩu?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="input-field" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
                value="nhandien23456@"
              >
              <button type="button" class="toggle-pwd" data-for="login-password" aria-label="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            Đăng nhập
          </button>
        </form>

        <div class="divider">
          <span>Hoặc tiếp tục với</span>
        </div>

        <!-- 2 nút Google & Facebook cân đối 50/50 -->
        <div class="social-grid">
          <a href="/auth/google" class="btn-social btn-google" title="Đăng nhập bằng Google">
            <svg class="social-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google</span>
          </a>

          <a href="/auth/facebook" class="btn-social btn-facebook" title="Đăng nhập với Facebook">
            <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>Facebook</span>
          </a>
        </div>

        <div class="card-footer">
          <span>Chưa có tài khoản?</span>
          <a href="/register" class="link-accent switch-view" data-target="panel-register">Đăng ký ngay</a>
        </div>
      </div>

      <!-- ==================== VIEW 2: ĐĂNG KÝ ==================== -->
      <div id="panel-register" class="view-panel {% if view == 'register' %}active{% endif %}">
        <div class="header">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </div>
          <h1 class="title">Đăng ký tài khoản</h1>
        </div>

        <form method="post" action="/register" autocomplete="on">
          <div class="form-group">
            <label class="label" for="reg-username">Tên đăng nhập</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="reg-username" 
                name="username" 
                class="input-field" 
                required 
                autocomplete="username" 
                value="{{ last_username|default('', true) }}"
                {% if view == 'register' %}autofocus{% endif %}
              >
            </div>
          </div>

          <div class="form-group">
            <label class="label" for="reg-name">Họ và tên</label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="reg-name" 
                name="full_name" 
                class="input-field no-icon" 
                autocomplete="name"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="label" for="reg-password">Mật khẩu</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="reg-password" 
                name="password" 
                class="input-field" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-pwd" data-for="reg-password" aria-label="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="label" for="reg-confirm">Xác nhận mật khẩu</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="reg-confirm" 
                name="confirm_password" 
                class="input-field" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-pwd" data-for="reg-confirm" aria-label="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            Tạo tài khoản
          </button>
        </form>

        <div class="card-footer">
          <span>Đã có tài khoản?</span>
          <a href="/login" class="link-accent switch-view" data-target="panel-login">Đăng nhập</a>
        </div>
      </div>

      <!-- ==================== VIEW 3: QUÊN MẬT KHẨU ==================== -->
      <div id="panel-forgot" class="view-panel {% if view == 'forgot' %}active{% endif %}">
        <div class="header">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-2-2l2 2m0 0l-7 7m7-7l-7 7m0 0H7a5 5 0 0 0-5 5v2h2v-2a3 3 0 0 1 3-3h4l7-7z"></path>
            </svg>
          </div>
          <h1 class="title">Khôi phục mật khẩu</h1>
        </div>

        <form method="post" action="/forgot-password" autocomplete="on">
          <div class="form-group">
            <label class="label" for="forgot-account">Tài khoản / Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input 
                type="text" 
                id="forgot-account" 
                name="account" 
                class="input-field" 
                placeholder="Tên đăng nhập hoặc email" 
                required 
                autocomplete="username"
                {% if view == 'forgot' %}autofocus{% endif %}
              >
            </div>
          </div>

          <button type="submit" class="btn-submit">
            Gửi yêu cầu khôi phục
          </button>
        </form>

        <div class="card-footer">
          <span>Nhớ mật khẩu?</span>
          <a href="/login" class="link-accent switch-view" data-target="panel-login">Quay lại đăng nhập</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function() {
      // Toggle password reveal
      var eyeSvg = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      var eyeOffSvg = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

      document.querySelectorAll('.toggle-pwd').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = btn.getAttribute('data-for');
          var input = document.getElementById(targetId);
          if (!input) return;
          var isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          var svg = btn.querySelector('svg');
          if (svg) svg.innerHTML = isPassword ? eyeOffSvg : eyeSvg;
          btn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        });
      });

      // Seamless client-side view switching (Login / Register / Forgot Password)
      var panels = document.querySelectorAll('.view-panel');
      document.querySelectorAll('.switch-view').forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          var targetPanelId = link.getAttribute('data-target');
          panels.forEach(function(p) { p.classList.remove('active'); });
          var target = document.getElementById(targetPanelId);
          if (target) {
            target.classList.add('active');
            var firstInput = target.querySelector('input:not([type=hidden])');
            if (firstInput) firstInput.focus();
          }
          // Update URL without page reload
          var path = '/login';
          if (targetPanelId === 'panel-register') path = '/register';
          else if (targetPanelId === 'panel-forgot') path = '/forgot-password';
          if (window.history && window.history.pushState) {
            window.history.pushState(null, '', path);
          }
        });
      });

      // Loading state và validation thân thiện khi bấm gửi form
      document.querySelectorAll('form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
          var btn = form.querySelector('.btn-submit');
          if (!btn) return;

          // Xóa thông báo lỗi cũ nếu có
          var existingErr = form.querySelector('.dynamic-form-error');
          if (existingErr) existingErr.remove();

          var usernameInput = form.querySelector('input[name="username"]');
          var passwordInput = form.querySelector('input[name="password"]');
          var confirmInput = form.querySelector('input[name="confirm_password"]');
          var accountInput = form.querySelector('input[name="account"]');

          var errorMsg = '';
          if (usernameInput && !usernameInput.value.trim()) {
            errorMsg = 'Vui lòng nhập tên đăng nhập.';
            usernameInput.focus();
          } else if (passwordInput && !passwordInput.value) {
            errorMsg = 'Vui lòng nhập mật khẩu.';
            passwordInput.focus();
          } else if (confirmInput && passwordInput && confirmInput.value !== passwordInput.value) {
            errorMsg = 'Mật khẩu xác nhận không khớp.';
            confirmInput.focus();
          } else if (accountInput && !accountInput.value.trim()) {
            errorMsg = 'Vui lòng nhập tên đăng nhập hoặc email.';
            accountInput.focus();
          }

          if (errorMsg) {
            e.preventDefault();
            var alertDiv = document.createElement('div');
            alertDiv.className = 'alert-box alert-error dynamic-form-error';
            alertDiv.setAttribute('role', 'alert');
            alertDiv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>' + errorMsg + '</span>';
            btn.parentNode.insertBefore(alertDiv, btn);
            return;
          }

          // Kích hoạt trạng thái loading và vô hiệu hóa nút bấm tránh gửi kép
          btn.disabled = true;
          var act = form.getAttribute('action') || '';
          var loadingLabel = act.indexOf('/register') !== -1 ? 'Đang tạo tài khoản...' : (act.indexOf('/forgot') !== -1 ? 'Đang gửi yêu cầu...' : 'Đang đăng nhập...');
          btn.innerHTML = '<span class="btn-submit-spinner" aria-hidden="true"></span> <span>' + loadingLabel + '</span>';
        });
      });
    })();
  </script>

</body>
</html>
