{% extends "landing_base.html" %}
{% block title %}Đăng nhập — THÉP SƠN LÂM Industrial Core{% endblock %}

{% block content %}
<section class="relative min-h-screen flex items-center justify-center px-4 pt-[120px] pb-16 overflow-hidden">


  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-tsl-light via-white to-tsl-surface"></div>
  <div class="absolute -top-24 -right-24 -z-10 w-[420px] h-[420px] rounded-full bg-tsl-accent/10 blur-3xl"></div>
  <div class="absolute -bottom-24 -left-24 -z-10 w-[420px] h-[420px] rounded-full bg-tsl-primary/10 blur-3xl"></div>

  <div class="w-full max-w-[440px]">
    <div class="bg-white border border-tsl-border rounded-[24px] shadow-xl p-8 sm:p-10">


      <div class="text-center mb-8">
        <a href="/" class="inline-flex flex-col items-center leading-none">
          <span class="font-extrabold text-2xl text-tsl-primary tracking-[-0.5px]">THÉP SƠN LÂM</span>
          <span class="text-[0.7rem] font-semibold uppercase tracking-[1px] text-tsl-accent mt-1">Industrial Core</span>
        </a>
        <h1 class="font-bold text-[1.6rem] text-tsl-ink mt-6">Đăng nhập</h1>
        <p class="text-tsl-muted text-sm mt-1">Truy cập hệ thống quản trị</p>
      </div>

      {% if error %}
      <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-6">
        <span class="material-symbols-outlined text-[20px]">error</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" x-data="{ show: false }" class="flex flex-col gap-5">


        <div class="flex flex-col gap-1.5">
          <label class="font-medium text-sm text-tsl-text">Tài khoản</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tsl-faint text-[20px]">person</span>
            <input type="text" name="username" placeholder="Nhập tài khoản..." required autofocus
                   value="{{ last_username|default('admin', true) }}"
                   class="w-full h-[52px] pl-11 pr-4 rounded-xl border border-tsl-border bg-tsl-light/50 text-tsl-text placeholder-tsl-faint focus:outline-none focus:border-tsl-accent focus:ring-2 focus:ring-tsl-accent/20 transition-all">
          </div>
        </div>


        <div class="flex flex-col gap-1.5">
          <label class="font-medium text-sm text-tsl-text">Mật khẩu</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tsl-faint text-[20px]">lock</span>
            <input :type="show ? 'text' : 'password'" name="password" placeholder="••••••••" required
                   value="nhandien23456@"
                   class="w-full h-[52px] pl-11 pr-11 rounded-xl border border-tsl-border bg-tsl-light/50 text-tsl-text placeholder-tsl-faint focus:outline-none focus:border-tsl-accent focus:ring-2 focus:ring-tsl-accent/20 transition-all">
            <button type="button" @click="show = !show" tabindex="-1"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-tsl-faint hover:text-tsl-accent transition-colors">
              <span class="material-symbols-outlined text-[20px]" x-text="show ? 'visibility_off' : 'visibility'">visibility</span>
            </button>
          </div>
        </div>



        <button type="submit"
                class="w-full h-[52px] inline-flex items-center justify-center gap-2 rounded-full bg-tsl-accent text-white font-semibold tracking-wide shadow-sm transition-all duration-200 hover:bg-tsl-accent-hover hover:shadow-md hover:-translate-y-px active:translate-y-0">
          <span class="material-symbols-outlined text-[20px]">login</span>
          ĐĂNG NHẬP
        </button>
      </form>

      <div class="text-center mt-8 pt-6 border-t border-tsl-border">
        <a href="/" class="inline-flex items-center gap-1.5 text-sm font-medium text-tsl-muted hover:text-tsl-accent transition-colors">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          Về trang chủ
        </a>
      </div>

    </div>
  </div>
</section>
{% endblock %}
