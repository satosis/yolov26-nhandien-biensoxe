services:
  ai_core:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Single source of truth: the Postgres on the host at localhost:5432
      # (same camera_ai DB as .env / the host-run webapp). Inside the container
      # the host is reached via host.docker.internal.
      DATABASE_URL: postgresql://postgres:mysecretpassword@host.docker.internal:5432/camera_ai
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Camera discovery networking:
    # - Bridge network: ARP scan and unicast ONVIF work.
    # - Host network: multicast/broadcast discovery also works, but is less isolated.
    #
    # Default: bridge network. The ai_core service is a worker, not a web server,
    # so it does not publish HTTP ports.
    networks:
      - shared-services

    # Optional full discovery mode. Uncomment this and remove networks above
    # when deploying on Linux with host networking support.
    # network_mode: host

networks:
  shared-services:
    name: shared-services
    driver: bridge
