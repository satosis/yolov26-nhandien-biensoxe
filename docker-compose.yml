services:
  ai_core:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DATABASE_URL=postgresql://camera_user:password@global-postgres:5432/camera_ai
    # ─── CAMERA DISCOVERY NETWORKING ─────────────────────────────────
    # Bridge network: ARP scan + unicast ONVIF work. Multicast (WS-Discovery, Dahua UDP) does NOT.
    # Host network:   ALL discovery methods work (multicast + broadcast + ARP).
    #
    # Option A (default): Bridge — safe, isolated, ARP-only auto-discovery
    ports:
      - "8080:8000"
    networks:
      - shared-services
    # Option B: Host — full discovery. Uncomment below, comment out ports+networks above.
    # network_mode: host
    # ─────────────────────────────────────────────────────────────────

networks:
  shared-services:
    external: true
