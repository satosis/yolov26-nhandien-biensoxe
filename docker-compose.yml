services:
  ai_core:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: ${DATABASE_URL:?Run python scripts/start.py to configure the database}
    volumes:
      - ./data:/app/data
