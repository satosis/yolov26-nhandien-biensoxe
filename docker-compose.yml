services:
  ai_core:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8080:8000"
    volumes:
      - ./core:/app/core:ro
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./services:/app/services:ro
      - ./util:/app/util:ro
      - ./main.py:/app/main.py:ro
    networks:
      - surv-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-camera_ai}
      - POSTGRES_USER=${POSTGRES_USER:-camera_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - surv-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camera_user} -d ${POSTGRES_DB:-camera_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    profiles: ["db_admin"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8080"
    networks:
      - surv-net

networks:
  surv-net:
    driver: bridge

volumes:
  postgres_data:
