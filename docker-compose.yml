services:
  postgres:
    image: postgres:16-alpine
    container_name: camera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camera_ai
      POSTGRES_USER: camera_user
      POSTGRES_PASSWORD: camera_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shared-services

  ai_core:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://camera_user:camera_password@postgres:5432/camera_ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

    # Camera discovery networking:
    # - Bridge network: ARP scan and unicast ONVIF work.
    # - Host network: multicast/broadcast discovery also works, but is less isolated.
    #
    # Default: bridge network. The ai_core service is a worker, not a web server,
    # so it does not publish HTTP ports.
    networks:
      - shared-services

    # Optional full discovery mode. Uncomment this and remove networks above
    # when deploying on Linux with host networking support.
    # network_mode: host

networks:
  shared-services:
    name: shared-services
    driver: bridge

volumes:
  postgres_data:
    name: yolov26-nhandien-biensoxe_postgres_data
    external: true

