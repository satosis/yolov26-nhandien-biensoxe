services:
  ai_core:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile.ai_core
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_core
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DATABASE_URL=postgresql://camera_user:password@global-postgres:5432/camera_ai
    ports:
      - "8080:8000"
    networks:
      - shared-services

networks:
  shared-services:
    external: true

volumes:
  postgres_data:
